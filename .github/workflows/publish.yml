name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the action can push the rendered site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # No R/Python/Julia setup: the manual is pure Markdown with no
      # executable code chunks, so Quarto alone is enough to render it.
      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
